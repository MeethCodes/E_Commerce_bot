<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <link rel="stylesheet" href="../static/style.css"> <!-- Link to your CSS file -->
</head>
<body>
    <div class="chatbot">
        <ul class="chatlist" id="chatList"></ul>
        <div class="chatbox-wrapper">
            <input type="text" id="userInput1" class="chatbox" placeholder="Type your message here...">
            <button type="submit" id="submitButton1" class="submit-button">Send</button>
        </div>
    </div>
    <script src="../static/popup.js"></script>
</body>
</html>
